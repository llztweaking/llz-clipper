[package]
name = "appsdesktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "appsdesktop_lib"
# "cdylib" is only needed for mobile (Android/iOS) targets, which this
# Windows-only desktop app never builds for. Keeping it in unconditionally
# (the default Tauri v2 template) makes the Windows-GNU linker try to
# export the entire dependency tree's public symbol surface as a DLL,
# which overflows ld's export-ordinal table on this toolchain
# ("error: export ordinal too large") — dropping it fixes the link.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56.0"
keyring = "4.1.6"
tauri-plugin-dialog = "2.7.2"

